<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PubMed Search</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
        }

        .search-container {
            display: flex;
            margin-bottom: 30px;
        }

        #search-input {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px 0 0 4px;
        }

        #relevant-ids {
            flex: 1;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            margin-left: 10px;
        }

        #search-button {
            padding: 12px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
            margin-left: 10px;
        }

        #search-button:hover {
            background-color: #2980b9;
        }

        .results-container {
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .result-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-title {
            color: #2c3e50;
            font-size: 1.2rem;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .result-title a {
            color: inherit;
            text-decoration: none;
        }

        .result-title a:hover {
            text-decoration: underline;
        }

        .result-abstract {
            color: #555;
            margin-bottom: 10px;
        }

        .result-meta {
            display: flex;
            justify-content: space-between;
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        .result-score {
            color: #e74c3c;
            font-weight: bold;
        }

        .result-type {
            background-color: #f1c40f;
            color: white;
            padding: 3px 8px;
            border-radius: 3px;
            font-size: 0.8rem;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .no-results {
            padding: 20px;
            text-align: center;
            color: #7f8c8d;
            display: none;
        }

        .error-message {
            color: #e74c3c;
            padding: 10px;
            background-color: #fadbd8;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .pmid-link {
            color: #7f8c8d;
            text-decoration: none;
        }

        .pmid-link:hover {
            text-decoration: underline;
        }

        .metrics-container {
            background-color: #e8f4fc;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-around;
        }

        .metric {
            text-align: center;
        }

        .metric-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2c3e50;
        }

        .metric-label {
            font-size: 0.9rem;
            color: #7f8c8d;
        }

        .search-params {
            display: flex;
            margin-bottom: 15px;
            align-items: center;
        }

        .search-query {
            font-weight: bold;
            margin-right: 10px;
        }

        .top-k {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
<header>
    <h1>PubMed Search</h1>
</header>

<div class="error-message" id="error-message"></div>

<div class="search-container">
    <input type="text" id="search-input" placeholder="Enter your search query (e.g. cancer treatment)">
    <input type="text" id="relevant-ids" placeholder="Enter relevant IDs (comma separated)">
    <button id="search-button">Search</button>
</div>

<div class="loading" id="loading">
    <p>Searching PubMed articles...</p>
</div>

<div class="no-results" id="no-results">
    <p>No results found for your query.</p>
</div>

<div class="results-container" id="results-container"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const searchInput = document.getElementById('search-input');
        const relevantIdsInput = document.getElementById('relevant-ids');
        const searchButton = document.getElementById('search-button');
        const resultsContainer = document.getElementById('results-container');
        const loadingElement = document.getElementById('loading');
        const noResultsElement = document.getElementById('no-results');
        const errorElement = document.getElementById('error-message');

        // Set up event listeners
        searchButton.addEventListener('click', performSearchHandler);
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') performSearchHandler();
        });

        function performSearchHandler() {
            const query = searchInput.value.trim();
            const relevantIds = relevantIdsInput.value.trim();
            if (query) {
                performSearch(query, relevantIds);
            } else {
                errorElement.textContent = 'Please enter a search query';
                errorElement.style.display = 'block';
            }
        }

        async function performSearch(query, relevantIds) {
            // Show loading state
            loadingElement.style.display = 'block';
            noResultsElement.style.display = 'none';
            errorElement.style.display = 'none';
            resultsContainer.innerHTML = '';

            try {
                // Encode query for URL
                const encodedQuery = encodeURIComponent(query);
                const encodedRelevantIds = encodeURIComponent(relevantIds);

                // Make API request
                const response = await fetch(
                    `http://localhost:8088/search/hybrid-with-metrics?query=${encodedQuery}&relevant_ids=${encodedRelevantIds}`,
                    {
                        headers: {
                            'Accept': 'application/json'
                        }
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                loadingElement.style.display = 'none';

                if (data.results && data.results.length > 0) {
                    displayResults(data);
                } else {
                    noResultsElement.style.display = 'block';
                }
            } catch (error) {
                loadingElement.style.display = 'none';
                errorElement.textContent = `Error: ${error.message}`;
                errorElement.style.display = 'block';
                console.error('Search failed:', error);
            }
        }

        function displayResults(data) {
            resultsContainer.innerHTML = '';

            // Display search parameters
            const paramsElement = document.createElement('div');
            paramsElement.className = 'search-params';
            paramsElement.innerHTML = `
                <span class="search-query">Query: "${data.query}"</span>
                <span class="top-k">Top ${data.k} results</span>
            `;
            resultsContainer.appendChild(paramsElement);

            // Display metrics
            const metricsElement = document.createElement('div');
            metricsElement.className = 'metrics-container';
            metricsElement.innerHTML = `
                <div class="metric">
                    <div class="metric-value">${data.metrics['precision@k'].toFixed(2)}</div>
                    <div class="metric-label">Precision@${data.k}</div>
                </div>
                <div class="metric">
                    <div class="metric-value">${data.metrics.nDCG.toFixed(2)}</div>
                    <div class="metric-label">nDCG</div>
                </div>
            `;
            resultsContainer.appendChild(metricsElement);

            // Display results
            data.results.forEach(result => {
                const resultElement = document.createElement('div');
                resultElement.className = 'result-item';

                // Create clickable title
                const titleElement = document.createElement('div');
                titleElement.className = 'result-title';
                const titleLink = document.createElement('a');
                titleLink.href = `https://pubmed.ncbi.nlm.nih.gov/${result.id}/`;
                titleLink.target = '_blank';
                titleLink.textContent = result.title || 'No title available';
                titleElement.appendChild(titleLink);

                // Create abstract
                const abstractElement = document.createElement('div');
                abstractElement.className = 'result-abstract';
                abstractElement.textContent = result.abstract || 'No abstract available';

                // Create metadata row
                const metaElement = document.createElement('div');
                metaElement.className = 'result-meta';

                // Create clickable PMID
                const pmidLink = document.createElement('a');
                pmidLink.className = 'pmid-link';
                pmidLink.href = `https://pubmed.ncbi.nlm.nih.gov/${result.id}/`;
                pmidLink.target = '_blank';
                pmidLink.textContent = `PMID: ${result.id}`;

                // Create score elements (using original_score and bert_score)
                const scoresElement = document.createElement('div');
                scoresElement.style.display = 'flex';
                scoresElement.style.gap = '10px';

                const originalScoreElement = document.createElement('span');
                originalScoreElement.className = 'result-score';
                originalScoreElement.textContent = `Lexical/Semantic Score: ${result.original_score?.toFixed(4) || 'N/A'}`;
                originalScoreElement.style.color = '#3498db';

                const bertScoreElement = document.createElement('span');
                bertScoreElement.className = 'result-score';
                bertScoreElement.textContent = `BERT: ${result.bert_score?.toFixed(4) || 'N/A'}`;
                bertScoreElement.style.color = '#e74c3c';

                scoresElement.appendChild(originalScoreElement);
                scoresElement.appendChild(bertScoreElement);

                // Create match type
                const typeElement = document.createElement('span');
                typeElement.className = 'result-type';
                typeElement.textContent = result.match_type || 'unknown';

                // Assemble metadata
                metaElement.appendChild(pmidLink);
                metaElement.appendChild(scoresElement);
                metaElement.appendChild(typeElement);

                // Assemble result item
                resultElement.appendChild(titleElement);
                resultElement.appendChild(abstractElement);
                resultElement.appendChild(metaElement);

                // Add to results container
                resultsContainer.appendChild(resultElement);
            });
        }
    });
</script>
</body>
</html>
